services:
  - type: web
    name: christmas-tree-backend
    runtime: python
    region: singapore
    plan: free
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.1
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
